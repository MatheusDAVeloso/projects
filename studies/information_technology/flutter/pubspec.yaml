name: flutter_application
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Need to be after flutter declaration
  fonts:
  - family: Roboto
    fonts:
      - asset: fonts/roboto/Roboto-Regular.ttf
      - asset: fonts/roboto/Roboto-Bold.ttf
        weight: 700
  uses-material-design: true